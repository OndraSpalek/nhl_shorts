name: Be6player Shorts V6.7 - NHL live smoke and music

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Datum v CR (YYYY-MM-DD); prazdne = aktualni datum'
        required: false
        default: ''
        type: string
      mode:
        description: 'fixture = testovaci data; live = skutecne NHL API'
        required: true
        type: choice
        default: fixture
        options:
          - fixture
          - live

permissions:
  contents: read

jobs:
  shorts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kontrola souboru
        shell: bash
        run: |
          set -euo pipefail
          pwd
          ls -la
          for file in v66_pipeline.py v67_verify.py; do
            if [ ! -f "$file" ]; then
              echo "CHYBA: Chybi $file v koreni repozitare."
              exit 1
            fi
          done
          if [ "${{ inputs.mode }}" = "fixture" ] && [ ! -f demo/offline_api_fixture.json ]; then
            echo 'CHYBA: Chybi demo/offline_api_fixture.json.'
            exit 1
          fi

      - name: Zavislosti
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libcairo2
          python -m pip install pillow requests cairosvg tzdata

      - name: Jednotkove testy (pokud jsou nahrane)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo 'UPOZORNENI: Slozka tests chybi; jednotkove testy byly preskoceny.'
          fi

      - name: Vytvorit video a audit
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$INPUT_MODE" = "fixture" ]; then
            python v66_pipeline.py --date 2026-11-22 --fixture demo/offline_api_fixture.json --outdir shorts_preview --render --allow-demo-logos --seconds 2
            python v67_verify.py --outdir shorts_preview
          else
            DAY="${INPUT_DATE:-$(TZ=Europe/Prague date +%F)}"
            python v66_pipeline.py --date "$DAY" --outdir shorts_preview --render
            python v67_verify.py --outdir shorts_preview --require-live
          fi

      - name: Kontrolni protokol
        if: always()
        shell: bash
        run: |
          if [ -f shorts_preview/verification.md ]; then
            cat shorts_preview/verification.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ulozit vysledky (bez YouTube uploadu)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: be6player-shorts-v67-${{ github.run_id }}
          path: shorts_preview/
          if-no-files-found: warn
          retention-days: 14
