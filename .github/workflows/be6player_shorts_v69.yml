name: Be6player Shorts V7.5 - NHL video
run-name: Be6player V7.5 | ${{ inputs.mode }} | ${{ inputs.date || 'Aktualni datum CR' }}
on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Datum CR (YYYY-MM-DD), prazdne = dnes
        type: string
        default: ''
      mode:
        description: live nebo offline test
        type: choice
        default: live
        options: [live, fixture]
permissions:
  contents: read
concurrency:
  group: be6player-shorts-v72
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      proceed: ${{ steps.clock.outputs.proceed }}
    steps:
      - id: clock
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PYTHON'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          offset = datetime.now(ZoneInfo('Europe/Prague')).utcoffset().total_seconds()/3600
          expected = f'0 {int(10-offset)} * * *'
          proceed = os.environ['EVENT'] != 'schedule' or os.environ['CRON'] == expected
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print(f'proceed={str(proceed).lower()}', file=f)
          PYTHON
  shorts:
    needs: gate
    if: needs.gate.outputs.proceed == 'true' 
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalace
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libcairo2
          pip install -r requirements-shorts.txt
      - name: Pripravit oficialni loga pro testy
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          from pathlib import Path
          from PIL import Image
          from v65 import logos
          for code in ("CAR", "NYR"):
              (Path("assets/logos") / f"{code}.png").unlink(missing_ok=True)
          logos(["CAR", "NYR"], strict=True)
          for code in ("CAR", "NYR"):
              path = Path("assets/logos") / f"{code}.png"
              with Image.open(path) as img:
                  img.verify()
              print(f"{path}: OK")
          PYTHON
      - name: Kontrola souboru
        run: |
          for f in shorts_player_history.py animate_shorts.py assets/arena_v701.png render_advanced.py assets/arena_v692.png assets/arena_master.png examples/car_nyr.json examples/demo.json demo/offline_api_fixture.json shorts_match_facts.py; do test -f "$f" || { echo "Chybi $f"; exit 1; }; done
      - name: Testy
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Generovani a kontrola
        env:
          INPUT_DATE: ${{ inputs.date }}
          MODE: ${{ inputs.mode || 'live' }}
        run: |
          set -euo pipefail
          DAY="${INPUT_DATE:-$(TZ=Europe/Prague date +%F)}"
          args=()
          verify=()
          if [ "$MODE" = fixture ]; then
            DAY=2026-11-22
            args=(--fixture demo/offline_api_fixture.json --seconds 2)
          else
            verify=(--require-live)
          fi
          rm -rf shorts_preview
          python v66_pipeline.py --date "$DAY" --outdir shorts_preview --render "${args[@]}"
          python v67_verify.py --outdir shorts_preview "${verify[@]}"
          python v69_stamp.py "$DAY" "$MODE"
      - name: Vysledky
        id: artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: be6player-v75-${{ github.run_id }}-${{ github.run_attempt }}
          path: shorts_preview/
          if-no-files-found: warn
          retention-days: 14

      - name: Samostatny e-mail Shorts
        continue-on-error: true
        if: success() && (inputs.mode != 'fixture') && steps.artifact.outputs.artifact-id != ''
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: python shorts_notify.py
